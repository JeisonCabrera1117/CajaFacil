[package]
name = "cajafacil"
version = "0.1.0"
description = "CajaFácil - gestión de ventas e inventario"
authors = ["Daniel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cajafacil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite_migration = "1.3"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
printpdf = { version = "0.7", features = ["embedded_images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Versión exacta que `printpdf` 0.7 vendoriza internamente para `Image::from_dynamic_image`;
# se usa solo para cargar el logo antes de pasarlo a printpdf (ver pdf/render_pdf.rs).
image-para-printpdf = { package = "image", version = "=0.24.9", default-features = false, features = [
    "png",
    "jpeg",
] }
ab_glyph = "0.2"
imageproc = "0.25"
arboard = "3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
calamine = "0.26"
csv = "1"
encoding_rs = "0.8"
rust_xlsxwriter = "0.79"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
